name: Create release pull request

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-pr
  cancel-in-progress: false

jobs:
  release-pr:
    # Releases are cut from master. The repository default branch stays develop.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr-number: ${{ steps.changesets.outputs.pr-number }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install npm 12
        run: npm install --global npm@12.2.0

      - name: Install dependencies
        run: npm ci

      # The GitHub API commit mode signs the release commit, which the branch rules require.
      # A pull request opened with GITHUB_TOKEN does not start other workflows, so the
      # validate job runs CI on the release branch from this workflow.
      - name: Create or update the release pull request
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: npm run version-packages
          commit-message: "chore: release packages"
          pr-title: "chore: release packages"
          github-token: ${{ secrets.GITHUB_TOKEN }}

  validate:
    needs: release-pr
    if: needs.release-pr.outputs.pr-number != ''
    uses: ./.github/workflows/ci.yml
    with:
      ref: changeset-release/master
    secrets:
      WIZ_SENSOR_TOKEN: ${{ secrets.WIZ_SENSOR_TOKEN }}
