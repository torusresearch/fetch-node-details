name: Container config scan

on:
  pull_request:
    paths:
      - "Dockerfile"
      - "Dockerfile.dev"
      - "docker-compose.dev.yml"
      - "packages/fnd-server/**"
      - ".github/workflows/container-scan.yml"
  push:
    branches: [develop, master]
  schedule:
    - cron: "37 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kics:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Wiz sensor
        uses: Web3Auth/.github/.github/actions/wiz-sensor@545f7c255313f85d38a02dc36c4ad01387d03149 # v1.0.0
        with:
          enabled: ${{ vars.WIZ_SENSOR_ENABLED }}
          token: ${{ secrets.WIZ_SENSOR_TOKEN }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare KICS results directory
        run: mkdir -p kics-results

      - name: Run KICS scan
        uses: checkmarx/kics-github-action@4600d2f2e1dfb33fbf6e1dfd60a01fb18b202ba1 # master 2026-10-16, digest-pinned images
        with:
          path: .
          fail_on: critical,high
          output_formats: sarif
          output_path: kics-results
          enable_annotations: false

      - name: Upload KICS results
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: kics-results/results.sarif
          category: kics

  trivy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Wiz sensor
        uses: Web3Auth/.github/.github/actions/wiz-sensor@545f7c255313f85d38a02dc36c4ad01387d03149 # v1.0.0
        with:
          enabled: ${{ vars.WIZ_SENSOR_ENABLED }}
          token: ${{ secrets.WIZ_SENSOR_TOKEN }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          skip-dirs: node_modules,packages/fetch-node-details,packages/fnd-base,packages/constants
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          exit-code: "1"
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy results
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-results.sarif
          category: trivy
